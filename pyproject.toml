[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanova-photonic-defect-qml"
version = "0.1.0"
description = "Leakage-safe few-label NEU-CLS benchmark with a photonic quantum reservoir"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=2.2.6,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.7.2,<1.9",
  "scipy>=1.14,<2",
  "Pillow>=11,<13",
  "ImageHash>=4.3,<5",
  "PyYAML>=6,<7",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "tqdm>=4.66,<5",
  "psutil>=6,<8",
]

[project.optional-dependencies]
clip = ["torch>=2.6,<2.13", "torchvision>=0.21", "open-clip-torch>=3,<4"]
photonic = ["merlinquantum==0.4.1", "perceval-quandela>=1.2.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
quanova-qml = "quanova_qml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
