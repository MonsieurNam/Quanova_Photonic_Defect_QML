  <g id="source" data-pptx-bounds="64 615 1100 48"><text x="64" y="635" font-family="Arial" font-size="15" fill="#766E62">Matched 15-D controls: Random Fourier Features (RFF) and Extreme Learning Machine (ELM).</text><text x="64" y="656" font-family="Arial" font-size="15" fill="#766E62">RBF-SVM = radial-basis-function support vector machine. Resource value is pre-specified as label efficiency under shot and acceptance constraints.</text></g><g id="page-index" data-pptx-bounds="1124 667 92 30"><text x="1216" y="690" text-anchor="end" font-family="Arial" font-size="18" fill="#766E62">04 / 10</text></g>
